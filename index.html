<!DOCTYPE html>

<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTRL OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="boot-screen">
        <div id="boot-content">
            <div id="boot-logo">CTRL</div>
            <div id="boot-loading"></div>
        </div>
    </div>

<div id="desktop">

    <div id="top-bar">
        <div id="system-name">CTRL OS</div>

        <div id="system-time">7:43 PM</div>
    </div>
    
    <div id="clock-window" class="app-window">
        <div id="clock-title" class="window-title">Clock</div>
        <button id="clock-close" class="window-close">×</button>
        <div id="clock-display">12:00</div>
        <div id="clock-date">Monday, January 1</div>
    </div>
    <div id="calculator-window" class="app-window">
        <button class="window-close">×</button>
        <div class="window-title">Calculator</div>
        <div id="calculator-display">0</div>
        <div id="calculator-buttons">
            <button>AC</button>
            <button>±</button>
            <button>%</button>
            <button>÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button class="zero">0</button>
            <button>.</button>
            <button>=</button>
        </div>
    </div>
    <div id="files-window" class="app-window">
        <button class="window-close">×</button>
        <div class="window-title">Files</div>
        <div id="files-content">
            <div id="files-sidebar">
                <div class="sidebar-item active" data-folder="Home">Home</div>
                <div class="sidebar-item"data-folder="Documents">Documents</div>
                <div class="sidebar-item"data-folder="Downloads">Downloads</div>
                <div class="sidebar-item"data-folder="Pictures">Pictures</div>
            </div>
            <div id="files-main">
                <div id="files-path">Home</div>
                <div id="files-grid">
                    <div class="file-item" data-folder="Documents">
                        <div class="file-icon">📁</div>
                        <div class="file-name">Documents</div>
                    </div>
                    <div class="file-item" data-folder="Downloads">
                        <div class="file-icon">📁</div>
                        <div class="file-name">Downloads</div>
                    </div>
                    <div class="file-item" data-folder="Pictures">
                        <div class="file-icon">📁</div>
                        <div class="file-name">Pictures</div>
                    </div>
                    <div class="file-item" data-folder="Home">
                        <div class="file-icon">📁</div>
                        <div class="file-name">Home</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="notes-window" class="app-window">
        <button class="window-close">×</button>
        <div class="window-title">Notes</div>
        <textarea id="notes-text" placeholder="Start typing..."></textarea>
    </div>
    <div id="dock">
        <div class="dock-icon files">
            <img src="assets/icons/files.svg" alt="Files">
        </div>

        <div class="dock-icon browser">
            <img src="assets/icons/browser.svg" alt="Browser">
        </div>

        <div class="dock-icon notes">
            <img src="assets/icons/notes.svg" alt="Notes">
        </div>

        <div class="dock-icon settings">
            <img src="assets/icons/settings.svg" alt="Settings">
        </div>

        <div id="clock-icon" class="dock-icon clock">
            <img src="assets/icons/clock.svg" alt="Clock">
        </div>

        <div class="dock-icon calculator">
            <img src="assets/icons/calculator.svg" alt="Calculator">
        </div>
    </div>

    </div>

    <script src="script.js"></script>
    <script src="apps/notes.js"></script>
    <script src="apps/clock.js"></script>
    <script src="apps/calculator.js"></script>

</body>
<html>
